server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Flutter web app - SPA routing
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Flutter web file names are not content-hashed, so make browsers
    # revalidate code and manifests on every load.
    location ~* \.(js|mjs|wasm|json|css|html)$ {
        add_header Cache-Control "no-cache";
    }

    # Cache other static assets
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 256;
}
